# Override NGINX_PROXY_IP and POWERAI_NETWORK_SUBNET together when these defaults
# conflict with the host network. POWERAI_NETWORK_SUBNET must contain NGINX_PROXY_IP.
services:
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-powerai}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-powerai_hot}
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 768m

  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: e-ai-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - path: ${BACKEND_ENV_FILE:-/opt/e-ai/secrets/backend.env}
        required: false
    environment:
      AUTO_CRAWL_ENABLED: "false"
      TRUSTED_PROXY_CIDRS: "${NGINX_PROXY_IP:-10.42.0.10}/32"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: 1024m

  jobs:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: e-ai-backend:${IMAGE_TAG:-local}
    profiles: ["jobs"]
    env_file:
      - path: ${BACKEND_ENV_FILE:-/opt/e-ai/secrets/backend.env}
        required: false
    environment:
      AUTO_CRAWL_ENABLED: "false"
      TRUSTED_PROXY_CIDRS: "${NGINX_PROXY_IP:-10.42.0.10}/32"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m

  frontend:
    build: ./frontend
    image: e-ai-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 768m

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      default:
        ipv4_address: "${NGINX_PROXY_IP:-10.42.0.10}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 128m

volumes:
  pgdata:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-/opt/e-ai/secrets/postgres_password.txt}

networks:
  default:
    ipam:
      config:
        - subnet: "${POWERAI_NETWORK_SUBNET:-10.42.0.0/24}"
