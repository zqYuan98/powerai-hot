# 生产部署：docker compose --env-file .env up -d （完整流程见 deploy.sh 与 docs/RUNBOOK.md）
name: powerai

x-backend: &backend
  build:
    context: ../server
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  image: powerai-server:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    ENV: prod
    DATABASE_URL: postgresql+asyncpg://powerai:${POSTGRES_PASSWORD}@db:5432/powerai
  depends_on:
    db:
      condition: service_healthy
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: powerai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: powerai
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powerai -d powerai"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
    mem_limit: 768m

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  # 单实例：进程内持有 advisory lock，多开的会自动退出
  worker:
    <<: *backend
    command: ["python", "-m", "app.worker.main"]
    volumes:
      - ${BACKUP_DIR:-./backups}:/app/backups
    mem_limit: 768m

  web:
    build:
      context: ../web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: powerai-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
    mem_limit: 512m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    # 对外端口；与本机其他服务冲突时在 .env 里改，如 HTTP_BIND=127.0.0.1:18090
    ports:
      - "${HTTP_BIND:-80}:80"
      - "${HTTPS_BIND:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    logging: *logging
    mem_limit: 128m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
