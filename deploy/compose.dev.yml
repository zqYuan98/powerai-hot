# 本地开发只需要数据库：docker compose -f deploy/compose.dev.yml up -d
name: powerai-dev
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: powerai
      POSTGRES_PASSWORD: powerai
      POSTGRES_DB: powerai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
volumes:
  pgdata-dev:
