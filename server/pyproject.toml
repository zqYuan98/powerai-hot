[project]
name = "powerai-server"
version = "2.0.0"
description = "电力基建情报站：采集、分析、商机抽取与 API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "feedparser>=6.0.11",
  "openai>=1.55",
  "apscheduler>=3.10,<4",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
browser = ["playwright>=1.49"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML",
  "pgserver>=0.1.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 中文全角标点是有意为之

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff.lint.per-file-ignores]
"app/pipeline/tuning.py" = ["E501"]  # 画像文本
"app/pipeline/rules.py" = ["E501"]   # 关键词表
"tests/e2e_seed.py" = ["E501"]       # 示例文本

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
